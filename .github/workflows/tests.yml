on: [workflow_call, push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 1.46.3

      - run: deno task generate --no-replace-ids
      - run: deno task test
      - run: deno lint
