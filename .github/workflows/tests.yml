on: [workflow_call, push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: denoland/setup-deno@v1.5.2
        with:
          deno-version: 2.9.6

      - run: deno task generate --no-replace-ids
      - run: deno task test
      - run: deno lint
